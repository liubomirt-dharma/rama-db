name: Build and publish the video library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    outputs:
      source: ${{ steps.pages.outputs.source }}
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -p test_seo_build.py -v
      - run: python scripts/build_seo.py --fetch-thumbnails
      - run: python -m unittest discover -s tests -p test_seo_static.py -v
        env:
          RAMA_SEO_ROOT: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.source == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy
        id: release
        uses: actions/deploy-pages@v4
